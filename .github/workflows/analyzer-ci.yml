name: analyzer-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate preinstalled Android SDK
        run: |
          if [ -d "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME already set: $ANDROID_HOME"
          elif [ -d /usr/local/lib/android/sdk ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "Found /usr/local/lib/android/sdk"
          else
            echo "No Android SDK found on runner" >&2
            exit 1
          fi

      - name: Accept SDK licenses and install platform 35 + build-tools
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using SDK=$SDK"
          test -d "$SDK"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SM" ]; then
            SM=$(command -v sdkmanager || true)
          fi
          test -n "$SM"
          echo "sdkmanager=$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/tmp/sdk-licenses.txt || true
          # compileSdk 35 in app/build.gradle.kts
          "$SM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Verify Java and SDK
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
          echo "platform android-35 OK"
          echo "build-tools 35.0.0 OK"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK on disk
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK path: $APK"
          echo "APK size bytes: $SIZE"
          test "$SIZE" -gt 0
          python3 - <<'PY'
          import zipfile
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          z = zipfile.ZipFile(apk)
          names = z.namelist()
          print("zip_entries", len(names))
          assert "AndroidManifest.xml" in names
          assert any(n == "classes.dex" or (n.startswith("classes") and n.endswith(".dex")) for n in names)
          print("apk_structure_ok")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
