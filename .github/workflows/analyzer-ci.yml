name: analyzer-ci

on:
  push:
    # cursor/** so the existing job runs on the agent branch, not only after merge to main.
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate preinstalled Android SDK
        run: |
          if [ -d "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME already set: $ANDROID_HOME"
          elif [ -d /usr/local/lib/android/sdk ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "Found /usr/local/lib/android/sdk"
          else
            echo "No Android SDK found on runner" >&2
            exit 1
          fi

      - name: Accept SDK licenses and install platform 35 + build-tools
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using SDK=$SDK"
          test -d "$SDK"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SM" ]; then
            SM=$(command -v sdkmanager || true)
          fi
          test -n "$SM"
          echo "sdkmanager=$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/tmp/sdk-licenses.txt || true
          # compileSdk 35 in app/build.gradle.kts
          "$SM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Verify Java and SDK
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
          echo "platform android-35 OK"
          echo "build-tools 35.0.0 OK"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Dump failing unit-test reports
        if: failure()
        run: |
          echo "=== failing test messages ==="
          find app/build/test-results -name '*.xml' -print
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in Path("app/build/test-results").rglob("*.xml"):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  fail = case.find("failure")
                  if fail is None:
                      continue
                  print("====", case.get("classname"), case.get("name"), "====")
                  print(fail.get("message") or "")
                  body = fail.text or ""
                  print(body[:4000])
          PY

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name versioned APK
        id: apkmeta
        run: |
          set -e
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$SRC"
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          NAME="Match3Analyzer-${VERSION}-${SHORT_SHA}.apk"
          mkdir -p dist
          cp "$SRC" "dist/${NAME}"
          SIZE=$(stat -c%s "dist/${NAME}")
          echo "APK_NAME=${NAME}" >> "$GITHUB_ENV"
          echo "APK_PATH=dist/${NAME}" >> "$GITHUB_ENV"
          echo "apk_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=dist/${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Named APK: dist/${NAME} (${SIZE} bytes)"

      - name: Verify APK on disk
        run: |
          set -e
          APK="${{ steps.apkmeta.outputs.apk_path }}"
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK path: $APK"
          echo "APK size bytes: $SIZE"
          test "$SIZE" -gt 0
          # Filename must be unique per version+commit (never plain app-debug.apk as artifact)
          BASE="$(basename "$APK")"
          echo "APK basename: $BASE"
          case "$BASE" in
            Match3Analyzer-*.apk) echo "apk_name_ok" ;;
            *) echo "unexpected apk name: $BASE (expected Match3Analyzer-<version>-<sha>.apk)" >&2; exit 1 ;;
          esac
          if [ "$BASE" = "app-debug.apk" ]; then
            echo "refusing overwrite-style app-debug.apk artifact name" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os, zipfile
          apk = os.environ["APK_PATH"]
          z = zipfile.ZipFile(apk)
          names = z.namelist()
          print("zip_entries", len(names))
          assert "AndroidManifest.xml" in names
          assert any(n == "classes.dex" or (n.startswith("classes") and n.endswith(".dex")) for n in names)
          print("apk_structure_ok", os.path.basename(apk))
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apkmeta.outputs.apk_name }}
          path: ${{ steps.apkmeta.outputs.apk_path }}
          if-no-files-found: error
